# Kører syntakstjek og tests ved hvert push og pull request.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Laveste understøttede version og den version, Docker-miljøet bruger
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, pdo_mysql, intl
          coverage: none

      - name: Syntakstjek
        run: find src public tests bin config.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php tests/run.php
